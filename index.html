<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Differentia Consulting Customer Day 2026 Raffle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Marquee title across the top, laid out by app.js -->
  <svg id="title" class="title" aria-label="Differentia Consulting Customer Day 2026 Raffle">
    <defs>
      <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>

  <!-- Step 1: upload -->
  <section id="uploadView" class="upload">
    <label id="dropZone" class="drop-zone" for="fileInput">
      <div class="drop-icon">📄</div>
      <div class="drop-title">Drop the guest list Excel file here</div>
      <div class="drop-sub">or click to choose a file (.xlsx, .xls, .csv)</div>
      <div class="drop-sub">Only rows with <strong>raffle = Y</strong> are entered into the draw.</div>
      <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" hidden>
    </label>
    <p id="error" class="error hidden"></p>
  </section>

  <!-- Step 2: wheel -->
  <div id="wheelWrap" class="wheel-wrap hidden">
    <div class="pointer"></div>
    <canvas id="wheel"></canvas>
    <button id="hub" class="hub" disabled>SPIN</button>
  </div>

  <!-- Winners so far, placed beside the wheel by app.js -->
  <aside id="winnersPanel" class="winners hidden">
    <h2>🏆 Winners</h2>
    <ol id="winnersList"></ol>
  </aside>

  <footer>
    <div id="summary" class="summary"></div>
    <p id="wheelHint" class="wheel-hint"></p>
    <div class="footer-actions">
      <button id="soundBtn" class="ghost" title="Toggle sound">🔊 Sound on</button>
      <button id="newFileBtn" class="ghost hidden">Load another file</button>
    </div>
  </footer>

  <!-- Winner announcement -->
  <div id="winnerModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-label">🎉 And the winner is… 🎉</div>
      <div id="winnerName" class="winner-name"></div>
      <div id="winnerAccount" class="winner-account"></div>
      <div class="modal-actions">
        <button id="closeBtn">Close</button>
        <button id="redrawBtn" class="ghost">Not here? Remove &amp; redraw</button>
      </div>
    </div>
  </div>

  <!-- Full-screen layer for the flying names and confetti -->
  <canvas id="fx"></canvas>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
